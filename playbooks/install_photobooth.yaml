---
- name: Install photobooth
  hosts: photobooth
  become: false

  vars_prompt:
    - name: photobooth_version
      prompt: "Which version should be installed? Choose from pypi or 'github' for github main branch install."
      private: false
      default: "9.0.0"

  pre_tasks:
    - name: Check supported platform
      ansible.builtin.import_tasks: tasks/require_trixie.yaml
      tags: always

  roles:
    - photobooth
